spring:
  application:
    name: bocbang-backend
  servlet:
    multipart:
      # 1 hour of 16 kHz 16-bit mono WAV is ~115 MB; Uploads > 1 MB stream straight to disk.
      max-file-size: 500MB
      max-request-size: 500MB
      file-size-threshold: 1MB
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8099}
  shutdown: graceful
  tomcat:
    # WebSocket connections idle on the NIO poller, not on a thread each; inference runs on its own pool (stt.pool).
    threads:
      max: 200
    max-connections: 8192
    accept-count: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      status:
        # BUSY (every stream slot taken) ranks below UP here, so /actuator/health stays 200 on a busy node.
        order: DOWN,OUT_OF_SERVICE,UP,BUSY,UNKNOWN
      group:
        # Readiness ranks BUSY above UP and answers 503 for it, so load balancers stop sending new streams;
        # liveness never depends on load.
        readiness:
          include: readinessState,stt
          status:
            order: DOWN,OUT_OF_SERVICE,BUSY,UP,UNKNOWN
            http-mapping:
              BUSY: 503

stt:
  # jni (default, native models below) or mock (scripted words, no model files). A new engine registers itself
  # for its own name, see README.
  engine: ${STT_ENGINE:jni}
  # How realtime streams share the machine (RuntimeProperties). On CPU, decoding a 15-20s utterance with a 1.7B model
  # can take 30-60s while the client keeps streaming: allow 120s of buffered audio so WebSockets are not dropped early.
  session:
    max-buffered-audio: ${STT_MAX_BUFFERED_AUDIO:120s}
  websocket:
    idle-timeout: ${STT_WS_IDLE_TIMEOUT:180s}
  # API keys accepted on /api/** and /ws/**, comma-separated. Empty (default) turns authentication off.
  # Actuator probes and the demo page never need a key.
  security:
    api-keys: ${STT_API_KEYS:}
    # true also requires the key on /actuator/metrics, /prometheus and /info; the health probes stay open.
    protect-actuator: ${STT_PROTECT_ACTUATOR:false}

  # Model baseline: 16 kHz mono PCM. Realtime endpoints reject other rates; long-audio jobs convert via ffmpeg.
  sample-rate: 16000
  max-utterance-seconds: 60
  # CPU threads used inside transcribe.cpp, whisper.cpp, and llama.cpp (G520 has 2x A78 + 6x A55; 4 is optimal).
  threads: ${STT_THREADS:4}
  # Directory containing libbocbang_transcribe.so, libbocbang_whisper.so, libbocbang_llama.so.
  # Leave blank to auto-detect native/dist/{android-arm64,linux-arm64,host} or java.library.path.
  native-lib-dir: ${STT_NATIVE_LIB_DIR:}
  # Unloads the ~1.3 GB ASR model before loading the ~2.5 GB Qwen 4B LLM so board RAM is never exceeded.
  unload-before-refine: ${STT_UNLOAD_BEFORE_REFINE:true}
  default-model: ${STT_DEFAULT_MODEL:qwen3-asr}

  models:
    # Multilingual / Vietnamese — loaded via libbocbang_transcribe.so (transcribe.cpp)
    qwen3-asr:
      backend: TRANSCRIBE_CPP
      model-path: ${STT_QWEN_ASR_MODEL:${STT_MODEL_DIR:/data/local/tmp/bocbang/models}/qwen3-asr-1.7b-q4_k_m.gguf}
      language: ${STT_QWEN_ASR_LANG:}
      timeout: 5m

    # English-only — loaded via libbocbang_whisper.so (whisper.cpp)
    whisper-en:
      backend: WHISPER_CPP
      model-path: ${STT_WHISPER_MODEL:${STT_MODEL_DIR:/data/local/tmp/bocbang/models}/whisper-small-en.bin}
      language: en
      timeout: 5m

  # Silero VAD — loaded via libbocbang_whisper.so (whisper.cpp)
  vad:
    model-path: ${STT_VAD_MODEL:${STT_MODEL_DIR:/data/local/tmp/bocbang/models}/ggml-silero-vad.bin}
    threshold: 0.5
    min-speech-duration-ms: 250
    min-silence-duration-ms: 100
    speech-pad-ms: 30
    max-segment-seconds: 20
    max-merge-gap-seconds: 0.8

  # Transcript cleanup — loaded via libbocbang_llama.so (llama.cpp)
  refiner:
    enabled: ${STT_REFINER_ENABLED:true}
    model-path: ${STT_REFINER_MODEL:${STT_MODEL_DIR:/data/local/tmp/bocbang/models}/qwen3-4b-instruct-2507-q4_k_m.gguf}
    max-tokens: 2048
    temperature: 0.1
    max-batch-chars: 1500
    timeout: 10m

  # Converts any uploaded audio (mp3, m4a, ogg, wav of any rate/channels) to 16 kHz 16-bit mono WAV.
  ffmpeg:
    command:
      - ${STT_FFMPEG_BIN:ffmpeg}
      - -nostdin
      - -hide_banner
      - -loglevel
      - error
      - -y
      - -i
      - "{input}"
      - -vn
      - -map_metadata
      - "-1"
      - -ac
      - "1"
      - -ar
      - "{sample_rate}"
      - -c:a
      - pcm_s16le
      - -f
      - wav
      - "{output}"
    timeout: 15m

  jobs:
    directory: ${STT_JOBS_DIR:}
    max-queued: 20
    result-ttl: 24h
